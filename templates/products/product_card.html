<div class="card h-100">
    {% if product.image %}
        <img src="{{ product.image.url }}" 
             class="card-img-top" 
             alt="{{ product.name }}" 
             style="height: 200px; width: 100%; object-fit: contain; padding: 10px;">
    {% else %}
        <div class="text-center py-5 bg-light" style="height: 200px; display: flex; flex-direction: column; justify-content: center;">
            <i class="fas fa-image fa-3x text-muted mb-2"></i>
            <span class="text-muted">No image available</span>
        </div>
    {% endif %}
    <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text">{{ product.description|truncatewords:15|default:"No description available" }}</p>
        <div class="mt-auto">
            <p class="card-text mb-2"><strong>${{ product.price|floatformat:2 }}</strong></p>
            <a href="{% url 'products:product_detail' slug=product.slug %}" class="btn btn-primary w-100">View Details</a>
        </div>
    </div>
</div>
