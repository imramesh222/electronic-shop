{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>All Categories</h2>
    <div class="row">
        {% for category in categories %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ category.name }}</h5>
                    <p class="card-text">{{ category.description|truncatewords:20 }}</p>
                    <a href="{% url 'products:category_detail' slug=category.slug %}" class="btn btn-primary">View Products</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
