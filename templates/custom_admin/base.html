<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} - Electronic Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar-link {
            transition: all 0.3s ease;
        }
        .sidebar-link:hover {
            background-color: rgba(99, 102, 241, 0.1);
            border-left: 4px solid #6366f1;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .stat-card-2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .stat-card-3 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .stat-card-4 {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-lg">
            <div class="p-6">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center">
                        <i class="fas fa-store text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">Admin Panel</h1>
                        <p class="text-xs text-gray-500">Electronic Shop</p>
                    </div>
                </div>
            </div>
            
            <nav class="mt-6">
                <a href="{% url 'custom_admin:dashboard' %}" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:text-indigo-600">
                    <i class="fas fa-tachometer-alt w-5 mr-3"></i>
                    Dashboard
                </a>
                <a href="{% url 'custom_admin:orders' %}" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:text-indigo-600">
                    <i class="fas fa-shopping-cart w-5 mr-3"></i>
                    Orders
                </a>
                <a href="{% url 'custom_admin:products' %}" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:text-indigo-600">
                    <i class="fas fa-box w-5 mr-3"></i>
                    Products
                </a>
                <a href="{% url 'custom_admin:categories' %}" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:text-indigo-600">
                    <i class="fas fa-tags w-5 mr-3"></i>
                    Categories
                </a>
                <a href="{% url 'custom_admin:users' %}" class="sidebar-link flex items-center px-6 py-3 text-gray-700 hover:text-indigo-600">
                    <i class="fas fa-users w-5 mr-3"></i>
                    Users
                </a>
            </nav>
            
            <div class="absolute bottom-0 w-64 p-6">
                <div class="border-t pt-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-gray-600 text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-medium text-gray-700">{{ request.user.email }}</p>
                            <p class="text-xs text-gray-500">Administrator</p>
                        </div>
                    </div>
                    <a href="{% url 'custom_admin:logout' %}" class="mt-3 flex items-center text-sm text-red-600 hover:text-red-800">
                        <i class="fas fa-sign-out-alt mr-2"></i>
                        Logout
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto">
            <!-- Top Bar -->
            <div class="bg-white shadow-sm border-b">
                <div class="px-6 py-4">
                    <h2 class="text-2xl font-bold text-gray-800">{% block page_title %}Dashboard{% endblock %}</h2>
                </div>
            </div>
            
            <!-- Content -->
            <div class="p-6">
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
